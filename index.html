<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Porównywarki OC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="nav-bottom">
  <header class="topbar">
    <div class="topbar-left">
      <button type="button" class="site-menu-btn" id="site-nav-open" aria-expanded="false" aria-controls="site-nav-panel" title="Lista stron">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M3 5h12M3 9h12M3 13h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="site-current" id="site-current-label">Strony</span>
    </div>
    <div class="topbar-center">
      <label class="search-wrap" for="tag-search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11.5 11.5 L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input id="tag-search" type="search" placeholder="Szukaj po tagach…" autocomplete="off" />
      </label>
    </div>
    <div class="topbar-right">
      <div class="nav-variant-toggle" role="group" aria-label="Wariant nawigacji">
        <button type="button" class="pill-btn is-active" data-nav="bottom">Bottom</button>
        <button type="button" class="pill-btn" data-nav="overlay">Overlay</button>
      </div>
      <div class="device-toggle" role="group" aria-label="Urządzenie">
        <button type="button" class="pill-btn is-active" data-device="desktop">Desktop</button>
        <button type="button" class="pill-btn" data-device="mobile">Mobile</button>
      </div>
    </div>
  </header>

  <div class="tag-chips" id="tag-chips" aria-label="Tagi"></div>

  <main class="layout" id="flow-mode">
    <aside class="step-strip" id="step-strip" aria-label="Kroki flow"></aside>
    <section class="stage">
      <div class="stage-frame" id="stage-frame">
        <img id="main-shot" alt="" />
        <div class="empty-state" id="flow-empty" hidden>
          <p>Brak screenshotów dla tej kombinacji.</p>
        </div>
      </div>
    </section>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-block">
        <p class="meta-label">Tagi</p>
        <div class="sidebar-tags" id="sidebar-tags"></div>
      </div>
      <div class="sidebar-block">
        <p class="meta-label">Opis</p>
        <p class="meta-body" id="sidebar-desc">—</p>
      </div>
      <div class="sidebar-block meta-row">
        <div>
          <p class="meta-label">Porównywarka</p>
          <p class="meta-body" id="sidebar-site">—</p>
        </div>
        <div>
          <p class="meta-label">Krok</p>
          <p class="meta-body" id="sidebar-step">—</p>
        </div>
      </div>
      <div class="sidebar-block">
        <p class="meta-label">Urządzenie</p>
        <p class="meta-body" id="sidebar-device">—</p>
      </div>
    </aside>
  </main>

  <main class="compare-layout" id="compare-mode" hidden>
    <header class="compare-header">
      <h1 id="compare-title">Wyniki tagu</h1>
      <p class="compare-sub" id="compare-sub"></p>
    </header>
    <div class="compare-grid" id="compare-grid"></div>
    <div class="empty-state" id="compare-empty" hidden>
      <p>Brak ekranów z tym tagiem dla wybranego urządzenia.</p>
    </div>
  </main>

  <div class="site-nav-backdrop" id="site-nav-backdrop" hidden></div>
  <aside class="site-nav-panel" id="site-nav-panel" role="dialog" aria-modal="true" aria-labelledby="site-nav-title" aria-hidden="true">
    <div class="site-nav-grab" aria-hidden="true"></div>
    <div class="site-nav-header">
      <h2 id="site-nav-title">Strony</h2>
      <button type="button" class="site-nav-close" id="site-nav-close" aria-label="Zamknij">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M4.5 4.5l9 9M13.5 4.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <label class="site-search-wrap" for="site-search">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M11.5 11.5 L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="site-search" type="search" placeholder="Szukaj strony…" autocomplete="off" />
    </label>
    <div class="site-list" id="site-list" role="listbox" aria-label="Lista porównywarek"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
