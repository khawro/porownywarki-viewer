<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Porównywarki OC</title>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="app-title" href="/" id="app-title">InsurTech Flows</a>
      <button type="button" class="back-btn" id="back-btn" hidden title="Powrót" aria-label="Powrót">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M11 4 L6 9 L11 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="site-current" id="site-current-label" hidden>Strony</span>
    </div>
    <div class="topbar-center">
      <div class="tag-search-box" id="tag-search-box">
        <label class="search-wrap" for="tag-search">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M11.5 11.5 L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input id="tag-search" type="search" placeholder="Szukaj" autocomplete="off" />
        </label>
        <div class="tag-popover" id="tag-popover" hidden>
          <div class="tag-chips" id="tag-chips" aria-label="Tagi i strony"></div>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <button type="button" class="theme-toggle" id="theme-toggle" data-theme-toggle aria-label="Przełącz motyw" title="Przełącz motyw" aria-pressed="false">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <div class="device-toggle" role="group" aria-label="Urządzenie">
        <button type="button" class="pill-btn is-active" data-device="desktop">Desktop</button>
        <button type="button" class="pill-btn" data-device="mobile">Mobile</button>
      </div>
    </div>
  </header>

  <main class="home-layout" id="home-mode">
    <div class="site-cards" id="site-cards"></div>
  </main>

  <main class="layout" id="flow-mode" hidden>
    <aside class="step-strip" id="step-strip" aria-label="Kroki flow"></aside>
    <section class="stage">
      <div class="flow-tabs" id="flow-tabs" role="group" aria-label="Flow" hidden></div>
      <div class="stage-nav" id="stage-nav">
        <button type="button" class="nav-btn" id="stage-prev" data-nav="-1" aria-label="Poprzedni ekran" title="Poprzedni ekran (←)">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4 L6 9 L11 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="step-counter" id="stage-counter" aria-live="polite">—</span>
        <button type="button" class="nav-btn" id="stage-next" data-nav="1" aria-label="Następny ekran" title="Następny ekran (→)">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4 L12 9 L7 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="stage-frame" id="stage-frame">
        <button type="button" class="shot-open" id="shot-open" aria-label="Powiększ ekran" title="Powiększ ekran">
          <img id="main-shot" alt="" />
        </button>
        <div class="empty-state" id="flow-empty" hidden>
          <p>Brak screenshotów dla tej kombinacji.</p>
        </div>
      </div>
    </section>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-block">
        <p class="meta-label">Tagi</p>
        <div class="sidebar-tags" id="sidebar-tags"></div>
      </div>
      <div class="sidebar-block">
        <p class="meta-label">Opis</p>
        <p class="meta-body" id="sidebar-desc">—</p>
      </div>
      <div class="sidebar-block meta-row">
        <div>
          <p class="meta-label">Porównywarka</p>
          <p class="meta-body" id="sidebar-site">—</p>
        </div>
        <div>
          <p class="meta-label">Krok</p>
          <p class="meta-body" id="sidebar-step">—</p>
        </div>
      </div>
      <div class="sidebar-block">
        <p class="meta-label">Urządzenie</p>
        <p class="meta-body" id="sidebar-device">—</p>
      </div>
    </aside>
  </main>

  <main class="compare-layout" id="compare-mode" hidden>
    <header class="compare-header">
      <h1 id="compare-title">Wyniki</h1>
      <p class="compare-sub" id="compare-sub"></p>
    </header>
    <div class="compare-grid" id="compare-grid"></div>
    <div class="empty-state" id="compare-empty" hidden>
      <p>Brak ekranów dla tego wyszukiwania i urządzenia.</p>
    </div>
  </main>


  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Podgląd ekranu">
    <div class="lightbox-top">
      <span class="lightbox-title" id="lightbox-title"></span>
      <span class="step-counter" id="lightbox-counter" aria-live="polite"></span>
      <button type="button" class="nav-btn" id="lightbox-close" aria-label="Zamknij podgląd" title="Zamknij (Esc)">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 5 L13 13 M13 5 L5 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="lightbox-main">
      <button type="button" class="nav-btn lightbox-prev" id="lightbox-prev" data-nav="-1" aria-label="Poprzedni ekran" title="Poprzedni ekran (←)">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4 L6 9 L11 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="lightbox-stage" id="lightbox-stage">
        <img id="lightbox-img" alt="" />
      </div>
      <button type="button" class="nav-btn lightbox-next" id="lightbox-next" data-nav="1" aria-label="Następny ekran" title="Następny ekran (→)">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4 L12 9 L7 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
