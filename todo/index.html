<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TODO — Porównywarki</title>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root {
      --bg: #f2f2f4;
      --card: #fff;
      --ink: #111;
      --muted: #6b6b76;
      --done: #0a8f5a;
      --done-bg: #e8f7ef;
      --open: #e85d04;
      --open-bg: #fff6ef;
      --rule-bg: #eef0f7;
      --rule-ink: #3a3f55;
      --badge-bg: #ececf1;
      --badge-rules-bg: #dde3f5; --badge-rules-ink: #3a4a7a;
      --badge-open-bg: #ffe2cc; --badge-open-ink: #a33d00;
      --badge-done-bg: #d8f3e5; --badge-done-ink: #0a6b44;
      --mark-border: #c5c5ce;
      --open-border: #ffd2ad;
      --open-mark-bg: #fff;
      --done-border: #bfe9d2;
      --done-ink: #1a3d2c;
      --rule-border: #d5dbeb;
      --rule-mark: #7a88b8;
      --link: #06c;
      --code-bg: rgba(0,0,0,.06);
      --err: #c00;
      --panel-shadow: 0 1px 2px rgba(0,0,0,.04);
      --btn-bg: #e8e8ec;
      --btn-hover: #dedee4;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #121214;
      --card: #1b1b1f;
      --ink: #ececee;
      --muted: #a3a3ab;
      --done: #2fbf7f;
      --done-bg: #14261d;
      --open: #ff8a3d;
      --open-bg: #2a1d13;
      --rule-bg: #1c2030;
      --rule-ink: #c3c9e0;
      --badge-bg: #2a2a30;
      --badge-rules-bg: #262d48; --badge-rules-ink: #b7c3f0;
      --badge-open-bg: #4a2a12; --badge-open-ink: #ffbf8f;
      --badge-done-bg: #173a29; --badge-done-ink: #7fe0b1;
      --mark-border: #55555e;
      --open-border: #5a3a1f;
      --open-mark-bg: #1b1b1f;
      --done-border: #24493a;
      --done-ink: #cdeedd;
      --rule-border: #2e3550;
      --rule-mark: #7f8dc4;
      --link: #6aa8ff;
      --code-bg: rgba(255,255,255,.1);
      --err: #ff6b6b;
      --panel-shadow: 0 1px 2px rgba(0,0,0,.4);
      --btn-bg: #26262b;
      --btn-hover: #303036;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      padding: 16px 16px 48px;
      padding-bottom: max(48px, env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
    a.back { color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 8px 12px 16px;
      box-shadow: var(--panel-shadow);
    }
    #status { font-size: 12px; color: var(--muted); margin: 8px 4px 4px; }
    #todo h1 { display: none; }
    #todo .intro {
      margin: 4px 4px 14px;
      color: var(--muted);
      font-size: 13px;
    }
    #todo section {
      margin: 0 0 18px;
    }
    #todo section:last-child { margin-bottom: 4px; }
    #todo h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin: 0 4px 10px;
      font-weight: 700;
    }
    #todo h2 .badge {
      font-size: 11px;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 650;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--muted);
    }
    #todo section.rules h2 .badge { background: var(--badge-rules-bg); color: var(--badge-rules-ink); }
    #todo section.active h2 .badge { background: var(--badge-open-bg); color: var(--badge-open-ink); }
    #todo section.queue h2 .badge { background: var(--badge-open-bg); color: var(--badge-open-ink); }
    #todo section.done h2 .badge { background: var(--badge-done-bg); color: var(--badge-done-ink); }
    #todo ul, #todo ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    #todo li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px;
      margin: 0 0 8px;
      border-radius: 12px;
      font-size: 15px;
      background: var(--bg);
    }
    #todo li .mark {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
      margin-top: 1px;
      border-radius: 7px;
      border: 2px solid var(--mark-border);
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      color: transparent;
    }
    #todo li .body { flex: 1; min-width: 0; }
    #todo li.open {
      background: var(--open-bg);
      border: 1px solid var(--open-border);
    }
    #todo li.open .mark {
      border-color: var(--open);
      background: var(--open-mark-bg);
    }
    #todo li.done {
      background: var(--done-bg);
      border: 1px solid var(--done-border);
      color: var(--done-ink);
    }
    #todo li.done .mark {
      border-color: var(--done);
      background: var(--done);
      color: #fff;
    }
    #todo li.done .mark::after { content: "✓"; }
    #todo li.done .body { text-decoration: none; opacity: 0.92; }
    #todo section.rules li {
      background: var(--rule-bg);
      border: 1px solid var(--rule-border);
      color: var(--rule-ink);
    }
    #todo section.rules li .mark {
      border-radius: 50%;
      border-color: var(--rule-mark);
      background: var(--rule-mark);
      color: #fff;
      font-size: 11px;
    }
    #todo section.rules li .mark::after { content: "i"; font-style: italic; font-family: Georgia, serif; }
    #todo section.rules li.done .mark::after { content: "i"; }
    #todo strong { font-weight: 650; }
    #todo a { color: var(--link); }
    #todo code {
      font-size: 12px;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .err { color: var(--err); font-size: 14px; }
    .head-actions { display: flex; align-items: center; gap: 12px; }
    .theme-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%;
      background: var(--btn-bg); color: var(--ink); cursor: pointer;
    }
    .theme-toggle:hover { background: var(--btn-hover); }
    .theme-toggle:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    .theme-toggle .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Kolejka zadań</h1>
    <div class="head-actions">
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Przełącz motyw" title="Przełącz motyw" aria-pressed="false">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <a class="back" href="/">← Viewer</a>
    </div>
  </header>
  <div class="panel">
    <p id="status">Ładowanie…</p>
    <div id="todo"></div>
  </div>
  <script src="/theme.js"></script>
  <script>
    function escapeHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function inlineFmt(s) {
      s = escapeHtml(s);
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      return s;
    }
    function sectionClass(title) {
      const t = title.toLowerCase();
      if (t.includes("zasada")) return "rules";
      if (t.includes("toku") || t.includes("progress")) return "active";
      if (t.includes("kolejka") || t.includes("queue")) return "queue";
      if (t.includes("zrobione") || t.includes("done")) return "done";
      return "";
    }
    function sectionBadge(cls) {
      if (cls === "rules") return "zasady";
      if (cls === "active") return "w toku";
      if (cls === "queue") return "do zrobienia";
      if (cls === "done") return "zrobione";
      return "";
    }
    function renderMarkdown(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let sectionOpen = false;
      let inList = null;
      let itemCount = 0;

      function closeList() {
        if (inList) { html += "</" + inList + ">"; inList = null; }
      }
      function closeSection() {
        closeList();
        if (sectionOpen) {
          html = html.replace("__COUNT__", String(itemCount));
          html += "</section>";
          sectionOpen = false;
          itemCount = 0;
        }
      }
      function openSection(title) {
        closeSection();
        const cls = sectionClass(title);
        const badge = sectionBadge(cls);
        html += '<section class="' + cls + '"><h2>' + inlineFmt(title);
        if (badge) html += '<span class="badge">' + badge + ' · __COUNT__</span>';
        html += "</h2>";
        sectionOpen = true;
        itemCount = 0;
      }
      function addItem(done, text, ordered) {
        const tag = ordered ? "ol" : "ul";
        if (inList !== tag) { closeList(); html += "<" + tag + ">"; inList = tag; }
        const kind = done ? "done" : "open";
        html += '<li class="' + kind + '"><span class="mark" aria-hidden="true"></span><span class="body">' + inlineFmt(text) + "</span></li>";
        itemCount += 1;
      }

      for (const raw of lines) {
        const line = raw.trimEnd();
        if (!line.trim()) { continue; }
        if (line.startsWith("# ")) { continue; }
        if (line.startsWith("## ")) {
          openSection(line.slice(3).trim());
          continue;
        }
        const task = line.match(/^(?:[-*]\s+|\d+\.\s+)\[([ xX])\]\s+(.*)$/);
        if (task) {
          addItem(task[1].toLowerCase() === "x", task[2], /^\d+\./.test(line));
          continue;
        }
        if (line.match(/^[-*]\s+/)) {
          addItem(false, line.replace(/^[-*]\s+/, ""), false);
          continue;
        }
        closeList();
        if (!sectionOpen) html += '<p class="intro">' + inlineFmt(line) + "</p>";
        else html += '<p class="intro">' + inlineFmt(line) + "</p>";
      }
      closeSection();
      return html;
    }
    async function load() {
      const el = document.getElementById("todo");
      const st = document.getElementById("status");
      try {
        const res = await fetch("/TODO.md?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        el.innerHTML = renderMarkdown(await res.text());
        st.textContent = "Źródło: TODO.md · odśwież po aktualizacji";
      } catch (e) {
        st.innerHTML = '<span class="err">Nie udało się wczytać listy.</span>';
        el.textContent = String(e);
      }
    }
    load();
  </script>
</body>
</html>
